# ==============================================================================
# Student Feedback System - Full Kubernetes Manifest (Roll No: 24MIS0031)
# Deployments and NodePort Services for v1, v2, v3
# ==============================================================================

# ---------------------------- VERSION 1 (Submit) ----------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-v1-deployment
  labels:
    app: feedback-system
    version: v1
    student: roll-24MIS0031
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feedback-system
      version: v1
  template:
    metadata:
      labels:
        app: feedback-system
        version: v1
    spec:
      containers:
      - name: feedback-app-v1
        image: 24mis0031/feedback-system:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-v1-service
  labels:
    app: feedback-system
    version: v1
spec:
  type: NodePort
  selector:
    app: feedback-system
    version: v1
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
    name: http

